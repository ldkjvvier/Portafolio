    <!-- Aplica el tema antes del primer paint para evitar FOUC -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('themeMode');
          var dark =
            mode === 'dark' ||
            ((mode === null || mode === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage no disponible: se usa el tema claro por defecto */
        }
      })();
