<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Javier Madariaga · Portafolio</title>
    <link rel="canonical" href="https://javiermadariaga.vercel.app/" />
    <script>
      // El portafolio se mudó a Vercel. Conserva ruta, query y #hash
      // (p. ej. /Portafolio/#cv o /Portafolio/cv/javier-madariaga-cv.pdf).
      var path = location.pathname.replace(/^\/Portafolio(\/|$)/, '/');
      location.replace('https://javiermadariaga.vercel.app' + path + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://javiermadariaga.vercel.app/" />
  </head>
  <body>
    <p>Este portafolio se mudó a <a href="https://javiermadariaga.vercel.app/">javiermadariaga.vercel.app</a>.</p>
  </body>
</html>
